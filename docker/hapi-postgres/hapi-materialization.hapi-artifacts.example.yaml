postgres:
  connection_string: postgresql://hapi:hapi@localhost:15432/hapi
  hapi_schema:
    schema: public
    resource_table: hfj_resource
    version_table: hfj_res_ver
    resource_pk_column: res_id
    version_resource_fk_column: res_id
    resource_type_column: res_type
    fhir_id_column: fhir_id
    current_version_column: res_ver
    version_number_column: res_ver
    updated_at_column: res_updated
    deleted_at_column: res_deleted_at
    encoding_column: res_encoding
    text_vc_column: res_text_vc
    text_lob_column: res_text
    decoded_view: fhir4ds_hapi_current_resources

hapi:
  base_url: http://localhost:18080/fhir
  timeout_seconds: 30
  # latest selects the newest loadable HAPI ValueSet when CQL omits a version.
  # Use "error" to require versioned CQL ValueSet declarations.
  valueset_version_policy: latest
  # bearer_token: replace-with-token
  headers: {}

artifacts:
  source: hapi

period:
  start: "2026-01-01"
  end: "2026-12-31"

worker:
  batch_size: 100
  poll_interval_seconds: 30
  max_attempts: 3
  retry_backoff_seconds: 60
  processing_timeout_seconds: 900
  notification_channel: fhir4ds_patient_changed
  fail_on_unsupported_storage: true

retention:
  inactive_result_days: 365
  audit_days: 180
  run_days: 365

defaults:
  audit_mode: population
  narratives: false
  filter_to_ip: false

results:
  persist_audit: true
  persist_measure_report: true
  publish_measure_report_to_hapi: true

libraries:
  # HAPI artifact mode resolves CQL Library resources through hapi.base_url.
  # Paths are only used by measures that override artifact_source: files.
  paths: []

terminology:
  # HAPI artifact mode resolves CQL-declared ValueSets through hapi.base_url.
  # ValueSets must contain an expansion, direct compose concepts, or be
  # expandable by HAPI $expand.
  # Paths are only used by measures that override artifact_source: files.
  valuesets: []

measures:
  - id: CMS122
    artifact_ref: CMS122FHIRDiabetesAssessGreaterThan9Percent
    version: "2025"
    tags: ["hosted-artifacts"]

  - id: CMS117
    artifact_ref: CMS117FHIRChildhoodImmunizationStatus
    version: "2025"
    tags: ["hosted-artifacts"]
