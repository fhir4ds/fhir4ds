[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fhir4ds-v2"
version = "0.0.19"
description = "FHIR for Data Science — unified package for FHIRPath, CQL, and SQL-on-FHIR analytics"
readme = "README.md"
license = {text = "AGPL-3.0-only"}
requires-python = ">=3.10"
authors = [
    {name = "FHIR4DS Team"}
]
keywords = ["fhir", "fhirpath", "cql", "duckdb", "healthcare", "sql", "analytics", "hl7"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    # ATOMICITY GATE (Joel ruling 2026-10-29): widened together with the
    # DuckDB 2.0 extension bundle (fhir4ds/*/extensions/*.duckdb2_extension
    # — both shipped in this change-set; guarded by
    # fhir4ds/tests/test_duckdb2_dual_support.py::test_pin_widening_atomicity).
    "duckdb>=1.5.5,<3",
    # duckdb 2.x Python client requires pytz for TIMESTAMPTZ rendering;
    # 2.x wheels are cp311+ so the marker scopes it to exactly those.
    "pytz; python_version >= '3.11'",
    "antlr4-python3-runtime>=4.10,<5.0",
    "python-dateutil>=2.8,<3.0",
    "pyarrow>=14.0.0",
    "orjson>=3.9.0",
    "pint>=0.21.0",
    "PyYAML>=6.0",
    "numpy",
]

[project.optional-dependencies]
# DuckDB line extras (D2, Joel ruling 2026-10-29 — narrowing only; pip
# intersects extra constraints with the wide base pin, which ships in the
# release that carries the dual extension bundle):
#   pip install fhir4ds-v2[duckdb1]   → pins duckdb to the 1.x line
#   pip install fhir4ds-v2[duckdb2]   → pins duckdb to 2.0.x (>=2,<2.1)
# pytz rides in BASE (marker-scoped py>=3.11) so 2.x adopters get it
# regardless of extra choice.
duckdb1 = [
    "duckdb>=1.5.5,<2",
]
duckdb2 = [
    "duckdb>=2.0.0,<2.1",
]
measures = [
    "pandas",
]
hapi = [
    "pandas",
    "psycopg[binary]>=3.1",
]
mongo = [
    "pandas",
    "pymongo>=4.6",
]
# Terminology service abstraction (Phase 1 of the medterm4ds integration).
# httpx backs HTTPTerminologyEndpoint; medterm4ds backs the in_process
# adapter. medterm4ds is published on PyPI so it is declared normally —
# pip install 'fhir4ds-v2[terminology]' pulls both.
#
# Bounded to <0.0.8: medterm4ds 0.0.7 (Athena campaign completion) adds
# exact closure-ancestry query surfaces, the urn:medterm4ds:athena-conceptmap
# $translate seam, and re-verified LocalDuckDB hybrid serving. medterm4ds
# minors have shipped silent behavior changes before (0.0.2 flipped
# expansion to active-only by default and moved $search to system/searchMode
# params), so re-verify the integration deliberately before each minor
# bump — see USER_DIRECTIVES in fhir4ds-private/docs/prompts/.ai_loop/.
terminology = [
    "httpx>=0.24",
    "medterm4ds>=0.0.7,<0.0.8",
]
# Phase 4 — Clinical Notes NER. Pulls the medspaCy + HuggingFace NER +
# SapBERT cascade transitively via medterm4ds[extraction]. fhir4ds
# itself NEVER imports medspacy / spacy / transformers / torch directly;
# those heavy deps are owned by medterm4ds so the core ``import fhir4ds``
# path remains zero-dep.
ner = [
    "medterm4ds[extraction]>=0.0.7,<0.0.8",
]
# Agentic interfaces: MCP stdio server (fhir4ds-mcp). Optional per the
# operations-layer FDD — core install stays dependency-lean.
mcp = [
    "mcp>=1.2",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
    "httpx>=0.24",
]

[project.urls]
Homepage = "https://fhir4ds.com"
Documentation = "https://fhir4ds.com/docs/getting-started/installation"
Repository = "https://github.com/fhir4ds/fhir4ds"
Issues = "https://github.com/fhir4ds/fhir4ds/issues"

[project.scripts]
fhir4ds = "fhir4ds.cli.main:main"
fhir4ds-mcp = "fhir4ds.mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["fhir4ds"]
# The dev server's built SPA + bundled DuckDB-WASM (static-cleanroom/,
# static-wasm/) are LOCAL build artifacts served from a source checkout —
# they are not package data (0.0.17 shipped none of them). Excluding them
# keeps the wheel at the established surface (extensions + Python only);
# without this the wheel grew ~54 MB with a duplicate 36 MB duckdb wasm.
exclude = [
  "fhir4ds/devserver/static",
  "fhir4ds/devserver/static-cleanroom",
  "fhir4ds/devserver/static-wasm",
]

[tool.hatch.build.targets.sdist]
include = [
    "/fhir4ds",
    "/README.md",
    "/pyproject.toml",
    "/hatch_build.py",
]
# Same rule as the wheel: the dev server's built SPA/WASM bundles are
# local build artifacts, not source (0.0.17 shipped none of them).
exclude = [
    "fhir4ds/devserver/static",
    "fhir4ds/devserver/static-cleanroom",
    "fhir4ds/devserver/static-wasm",
]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

# Test configuration
[tool.pytest.ini_options]
testpaths = ["fhir4ds"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short -p no:benchmark"
markers = [
    "slow: marks tests as slow",
    "compliance: FHIRPath compliance tests",
    "integration: integration tests",
]
norecursedirs = ["_archived_v1", "cql-tests", "spec_tests", "fixtures", "data"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["duckdb.*", "pyarrow.*", "fhirpath.*", "antlr4.*", "fhirpathpy.*", "orjson.*", "pint.*", "numpy.*", "pandas.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # function call in default argument
]

[tool.ruff.lint.isort]
known-first-party = ["fhir4ds"]

[tool.black]
target-version = ["py310", "py311", "py312"]
line-length = 100
