[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fhir4ds-v2"
version = "0.0.25"
description = "FHIR for Data Science — unified package for FHIRPath, CQL, and SQL-on-FHIR analytics"
readme = "README.md"
license = {text = "AGPL-3.0-only"}
requires-python = ">=3.10"
authors = [
    {name = "Montavon Informatics LLC"}
]
keywords = ["fhir", "fhirpath", "cql", "duckdb", "healthcare", "sql", "analytics", "hl7"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    # DuckDB pin: DuckDB 2.0 is the DEFAULT on Python >= 3.11 (cp311+ wheels
    # only) — the v0.0.24 performance campaign showed 2.0 ~10x faster than
    # 1.5.x at population scale (CMS130/CMS133 @5k patients) with the
    # validated `delim_join_as_cte=false` planner tuning that
    # fhir4ds.register() applies automatically on 2.x. Python 3.10 stays on
    # the 1.5.x line (no 2.x wheels exist there); the [duckdb1] extra pins
    # 1.5.x explicitly for users who need it on 3.11+. The original
    # upstream planner pathology (duckdb/duckdb#28181) is mitigated by the
    # tuning; see docs/getting-started/benchmarking.md. Guarded by
    # fhir4ds/tests/test_duckdb2_dual_support.py and
    # fhir4ds/tests/test_packaging.py.
    "duckdb>=1.5.5,<2; python_version < '3.11'",
    "duckdb>=2.0.0,<2.1; python_version >= '3.11'",
    # duckdb 2.x Python client requires pytz for TIMESTAMPTZ rendering;
    # 2.x wheels are cp311+ so the marker scopes it to exactly those.
    "pytz; python_version >= '3.11'",
    "antlr4-python3-runtime>=4.10,<5.0",
    "python-dateutil>=2.8,<3.0",
    "pyarrow>=14.0.0",
    "orjson>=3.9.0",
    "pint>=0.21.0",
    "PyYAML>=6.0",
    "numpy",
]

[project.optional-dependencies]
# DuckDB line extras (Joel ruling 2026-11-18: DuckDB 2.0 is the DEFAULT on
# Python >= 3.11 — see the base-dependencies comment for the v0.0.24
# performance evidence; the upstream planner pathology is mitigated by the
# automatic `delim_join_as_cte=false` tuning):
#   pip install fhir4ds-v2[duckdb1]   → pins duckdb to the 1.5.x line
#                                       (the escape hatch on 3.11+)
#   pip install fhir4ds-v2[duckdb2]   → pins duckdb to 2.0.x explicitly
#                                       (>=2,<2.1, Python >=3.11; on 3.10
#                                       it resolves to the 1.5.x line —
#                                       2.x wheels are cp311+ only)
# pytz rides in BASE (marker-scoped py>=3.11) so 2.x adopters get it
# regardless of extra choice.
duckdb1 = [
    "duckdb>=1.5.5,<2",
]
duckdb2 = [
    "duckdb>=2.0.0,<2.1; python_version >= '3.11'",
]
# FHIR R4 / SQL-on-FHIR HTTP surface (``fhir4ds serve``).
# The engine already depends on duckdb + pyarrow, so parquet output needs
# nothing extra; fastapi/uvicorn are the only additions.
serve = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
]
# Phase-3 write surface: the Hub-backed publish store. `serve` works without
# this extra (LocalDirStore only), so a unit run never needs a token.
hf = [
    "huggingface-hub>=0.20",
]
measures = [
    "pandas",
]
hapi = [
    "pandas",
    "psycopg[binary]>=3.1",
]
mongo = [
    "pandas",
    "pymongo>=4.6",
]
# Terminology service abstraction (Phase 1 of the medterm4ds integration).
# httpx backs HTTPTerminologyEndpoint; medterm4ds backs the in_process
# adapter. medterm4ds is published on PyPI so it is declared normally —
# pip install 'fhir4ds-v2[terminology]' pulls both.
#
# Bounded to <0.0.15: medterm4ds 0.0.14 (draft dist at ~/src/medterm4ds/dist
# as of 2026-11-20; PENDING PyPI publication). The 0.0.14 release carries the
# PR-#24 inference lock that fixes concurrent-native-inference (the root cause
# behind the fhir4ds FHIR4-22 min-TypeErrors and same-process segfaults) and
# ships docs/threading-and-embedding.md — one thread per DuckDB connection is
# the supported in-process contract. Install-from-draft until it publishes:
# pip install ~/src/medterm4ds/dist/medterm4ds-0.0.14-py3-none-any.whl
# Both extras are pinned to the same bound so they stay mutually satisfiable;
# they had drifted apart (terminology <0.0.11, ner <0.0.10) and could not be
# installed together. (Previous bound <0.0.14 resolved against PyPI on
# 2026-11-15: fhir4ds-v2 0.0.24 + medterm4ds 0.0.13.)
# 0.0.12 (2026-11-13) and 0.0.13 (2026-11-15) were validated together with
# this bump via the fhir4ds terminology/OMOP suites and the clean-venv
# install smoke. 0.0.10 was the last independently reviewed release (search
# performance — cached lexical orphan surfaces, hybrid fusion depth 25,
# v3-index-ready posting keys with a 2-char acronym casing guard; reviewed
# independently 2026-11-05, SHIP-WITH-FINDINGS, v2-index behavior
# verified bit-identical for the fhir4ds consumer). 0.0.9 was the search
# fusion release (reciprocal-rank fusion over the UNION of lexical +
# semantic candidates with agreement-aware match_grade; exact-surface
# lexical tier + acronym/2-char token search; single-source path
# defaults via medterm4ds.core.paths). The 0.0.8 integration surfaces
# (closure-ancestry queries, the urn:medterm4ds:athena-conceptmap
# $translate seam, LocalDuckDB hybrid serving) keep the same API.
# medterm4ds minors have shipped silent
# behavior changes before (0.0.2 flipped expansion to active-only by
# default and moved $search to system/searchMode params; 0.0.9 changed
# hybrid ranking and match_grade semantics), so re-verify
# the integration deliberately before each minor bump — see
# USER_DIRECTIVES in fhir4ds-private/docs/prompts/.ai_loop/.
terminology = [
    "httpx>=0.24",
    "medterm4ds>=0.0.14,<0.0.15",
]
# Phase 4 — Clinical Notes NER. Pulls the medspaCy + HuggingFace NER +
# SapBERT cascade transitively via medterm4ds[extraction]. fhir4ds
# itself NEVER imports medspacy / spacy / transformers / torch directly;
# those heavy deps are owned by medterm4ds so the core ``import fhir4ds``
# path remains zero-dep.
ner = [
    "medterm4ds[extraction]>=0.0.14,<0.0.15",
]
# Agentic interfaces: MCP stdio server (fhir4ds-mcp). Optional per the
# operations-layer FDD — core install stays dependency-lean.
mcp = [
    "mcp>=1.2",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
    "httpx>=0.24",
]

[project.urls]
Homepage = "https://fhir4ds.com"
Documentation = "https://fhir4ds.com/docs/getting-started/installation"
Repository = "https://github.com/fhir4ds/fhir4ds"
Issues = "https://github.com/fhir4ds/fhir4ds/issues"

[project.scripts]
fhir4ds = "fhir4ds.cli.main:main"
fhir4ds-mcp = "fhir4ds.mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["fhir4ds"]
# The dev server's built SPA + bundled DuckDB-WASM (static-cleanroom/,
# static-wasm/) are LOCAL build artifacts served from a source checkout —
# they are not package data (0.0.17 shipped none of them). Excluding them
# keeps the wheel at the established surface (extensions + Python only);
# without this the wheel grew ~54 MB with a duplicate 36 MB duckdb wasm.
exclude = [
  "fhir4ds/devserver/static",
  "fhir4ds/devserver/static-cleanroom",
  "fhir4ds/devserver/static-wasm",
]

[tool.hatch.build.targets.sdist]
include = [
    "/fhir4ds",
    "/README.md",
    "/pyproject.toml",
    "/hatch_build.py",
]
# Same rule as the wheel: the dev server's built SPA/WASM bundles are
# local build artifacts, not source (0.0.17 shipped none of them).
exclude = [
    "fhir4ds/devserver/static",
    "fhir4ds/devserver/static-cleanroom",
    "fhir4ds/devserver/static-wasm",
]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

# Test configuration
[tool.pytest.ini_options]
testpaths = ["fhir4ds"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short -p no:benchmark"
markers = [
    "slow: marks tests as slow",
    "compliance: FHIRPath compliance tests",
    "integration: integration tests",
]
norecursedirs = ["_archived_v1", "cql-tests", "spec_tests", "fixtures", "data"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["duckdb.*", "pyarrow.*", "fhirpath.*", "antlr4.*", "fhirpathpy.*", "orjson.*", "pint.*", "numpy.*", "pandas.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # function call in default argument
]

[tool.ruff.lint.isort]
known-first-party = ["fhir4ds"]

[tool.black]
target-version = ["py310", "py311", "py312"]
line-length = 100
