name: CI

on:
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - "web/website/**"
      - "docs/**"
      - "**/*.md"
  push:
    branches: [main, dev]
    paths-ignore:
      - "web/website/**"
      - "docs/**"
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python 3.10 lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout DQM conformance fixtures
        run: git submodule update --init tests/data/ecqm-content-qicore-2025

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,measures]"

      - name: Ruff cleaned packages
        run: >
          python -m ruff check
          fhir4ds/cli
          fhir4ds/dqm
          fhir4ds/sources
          --output-format=github

      - name: Pytest
        run: >
          python -m pytest
          fhir4ds/cli/tests
          fhir4ds/dqm
          fhir4ds/sources
          fhir4ds/cql/tests/unit
          fhir4ds/viewdef

  python-311:
    name: Python 3.11 compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout DQM conformance fixtures
        run: git submodule update --init tests/data/ecqm-content-qicore-2025

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,measures]"

      - name: Pytest compatibility signal
        run: >
          python -m pytest
          fhir4ds/cli/tests
          fhir4ds/dqm
          fhir4ds/sources
          fhir4ds/cql/tests/unit
          fhir4ds/viewdef
