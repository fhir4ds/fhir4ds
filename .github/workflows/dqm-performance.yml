name: DQM Performance Report

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dqm-performance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dqm-performance:
    name: DQM timing report
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout DQM conformance fixtures
        run: git submodule update --init tests/data/ecqm-content-qicore-2025

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,measures]"

      - name: Run DQM conformance timing suite
        run: python3 conformance/scripts/run_dqm.py

      - name: Upload DQM timing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dqm-performance-report
          path: conformance/reports/dqm_report.json
          if-no-files-found: warn
