name: Spec Conformance

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  conformance:
    name: Full conformance suite
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout DQM conformance fixtures
        run: git submodule update --init tests/data/ecqm-content-qicore-2025

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,measures]"

      - name: Run full conformance
        env:
          # FHIR4-64: bind every measure's ALL-COLUMNS SQL with EXPLAIN. On by
          # default (FHIR4DS_BIND_CHECK=0 opts out); set explicitly here so the
          # gate's intent is visible. This is the class that let CMS986 report
          # 73/73 while it could not bind at all. ~11 min of DuckDB planning for
          # the two suites (CMS1218 alone is ~124s), hence timeout-minutes: 60.
          FHIR4DS_BIND_CHECK: "1"
        run: python3 conformance/scripts/run_all.py

      - name: Upload conformance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-reports
          path: conformance/reports/*.json
          if-no-files-found: warn

  # Tier B real-browser audit with the whole CQL corpus on real duckdb-wasm. The per-PR
  # gate (ci.yml, cleanroom job) runs the curated families only; this scheduled job adds B5.
  wasm-parity:
    name: WASM parity - whole CQL corpus + QI-Core and US-Core measures on real duckdb-wasm
    runs-on: ubuntu-latest
    # US-Core 2025 dominates the job: translating all 74 measures takes ~25 min and running
    # them ~35 min more on a local runner, on top of QI-Core (~20 min) and Tier B.
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,measures]"

      - name: Install web deps and chromium
        working-directory: web/cql-cleanroom
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Tier B, including the whole CQL corpus on the real engine
        env:
          FHIR4DS_REQUIRE_WASM_PARITY: "1"
          FHIR4DS_REQUIRE_WASM_REAL: "1"
          FHIR4DS_WASM_FULL_CORPUS: "1"
        run: python -m pytest fhir4ds/operations/tests/test_wasm_parity_tier_b.py -q -p no:cacheprovider

      # Tier C: every measure's real population SQL on real duckdb-wasm, first QI-Core 2025,
      # then US-Core 2025. The whole suites are too slow for a PR; the PR job (ci.yml) runs a
      # curated set. Each suite is its own step so one failing does not hide the other.
      - name: Checkout DQM conformance fixtures (Tier C)
        run: git submodule update --init tests/data/ecqm-content-qicore-2025

      - name: Tier C (whole QI-Core 2025 suite on the real engine)
        env:
          FHIR4DS_REQUIRE_WASM_PARITY: "1"
          FHIR4DS_REQUIRE_WASM_REAL: "1"
          FHIR4DS_WASM_TIER_C_SUITE: "qi-core-2025"
        run: python -m pytest fhir4ds/operations/tests/test_wasm_parity_tier_c.py -q -p no:cacheprovider

      - name: Checkout DQM conformance fixtures (Tier C, US-Core)
        run: git submodule update --init tests/data/dqm-content-cms-2025

      - name: Tier C (whole US-Core 2025 suite on the real engine)
        env:
          FHIR4DS_REQUIRE_WASM_PARITY: "1"
          FHIR4DS_REQUIRE_WASM_REAL: "1"
          FHIR4DS_WASM_TIER_C_SUITE: "us-core-2025"
        run: python -m pytest fhir4ds/operations/tests/test_wasm_parity_tier_c.py -q -p no:cacheprovider

      - name: Upload WASM parity reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wasm-parity-reports
          path: tests/output/wasm-parity/*.json
          if-no-files-found: warn
